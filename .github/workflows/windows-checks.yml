name: Windows checks and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ORT_CACHE_DIR: ${{ github.workspace }}/.local-archive/dependencies/ort
      TEMP: ${{ github.workspace }}/.local-archive/test-runs/ci
      TMP: ${{ github.workspace }}/.local-archive/test-runs/ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject inconsistent release versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if ($env:RELEASE_TAG) { node scripts/check-version.mjs --tag $env:RELEASE_TAG }
          else { node scripts/check-version.mjs }
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
      - name: Check committed source inputs before compilation
        run: python scripts/check-source-inputs.py
      - name: Prepare tools and caches
        id: setup
        uses: ./.github/actions/windows-setup
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Prepare and verify native downloads
        run: |
          ./scripts/fetch-pdfium.ps1
          ./scripts/prepare-tesseract.ps1
          ./scripts/fetch-protoc.ps1
          python scripts/fetch-onnxruntime.py --repair-cargo-cache
          if ($LASTEXITCODE -ne 0) { throw 'Native download verification failed' }
      - name: Preserve verified native resources before later checks
        if: github.event_name != 'pull_request' && steps.setup.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.setup.outputs.native-cache-key }}
          path: |
            .local-archive/dependencies/pdfium-7881
            .local-archive/dependencies/downloads
            .local-archive/dependencies/tesseract-source-5.5.4
            .local-archive/dependencies/tesseract
            .local-archive/dependencies/tesseract-5.5.4
            .local-archive/dependencies/license-sources
            .local-archive/dependencies/ort
            .local-archive/native-ocr/binary-cache
            .local-archive/native-ocr/downloads
            .local-archive/tooling/protoc-36.2
      - name: Prepare native workers and license resources
        run: |
          ./scripts/prepare-desktop-resources.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native resource preparation failed' }
          $resourceChanges = git status --porcelain -- crates/pkms-core/resources/rich-export.zip crates/pkms-core/resources/rich-export.manifest.json
          if ($LASTEXITCODE -ne 0 -or $resourceChanges) { throw 'Regenerate and commit the offline rich-export resources before release.' }
          $protocPath = Join-Path $env:GITHUB_WORKSPACE '.local-archive/tooling/protoc-36.2/bin/protoc.exe'
          "PROTOC=$protocPath" >> $env:GITHUB_ENV
      - name: Real bilingual OCR and scanned PDF with Unicode paths
        run: |
          python scripts/verify-ocr-runtime.py --runtime .local-archive/dependencies/tesseract-5.5.4 --worker target/debug/pkms-worker.exe --pdfium .local-archive/dependencies/pdfium-7881/bin/pdfium.dll --output .local-archive/test-runs/ci/ocr
          if ($LASTEXITCODE -ne 0) { throw 'Bundled OCR integration failed' }
      - name: Rust workspace tests
        run: cargo test --workspace --locked
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generate contracts and reject drift
        run: |
          pnpm contracts:generate
          if ($LASTEXITCODE -ne 0) { throw 'Contract generation failed' }
          $contractChanges = git status --porcelain --untracked-files=all -- packages/contracts/src/generated
          if ($LASTEXITCODE -ne 0) { throw 'Contract status check failed' }
          if ($contractChanges) { throw 'Regenerate and commit the Rust-defined TypeScript contracts.' }
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Serial frontend behavior tests
        run: pnpm --filter @pkms/desktop exec node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
      - name: Frontend production build
        run: pnpm --filter @pkms/desktop build
      - name: Build unsigned Windows installer
        if: github.event_name != 'pull_request'
        run: pnpm desktop:build
      - name: Collect installer, checksums and inventory
        if: github.event_name != 'pull_request'
        run: ./scripts/package-release.ps1
      - name: Retain build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spanseek-windows-x64-${{ github.sha }}
          path: .local-archive/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
