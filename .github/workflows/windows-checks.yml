name: Windows checks and build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TEMP: ${{ github.workspace }}/.local-archive/test-runs/ci
      TMP: ${{ github.workspace }}/.local-archive/test-runs/ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject inconsistent release versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if ($env:RELEASE_TAG) { node scripts/check-version.mjs --tag $env:RELEASE_TAG }
          else { node scripts/check-version.mjs }
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
      - name: Check committed source inputs before compilation
        run: python scripts/check-source-inputs.py
      - name: Prepare tools and caches
        id: setup
        uses: ./.github/actions/windows-setup
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Prepare and verify native resources
        run: |
          ./scripts/prepare-desktop-resources.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native resource preparation failed' }
          $protocPath = Join-Path $env:GITHUB_WORKSPACE '.local-archive/tooling/protoc-36.2/bin/protoc.exe'
          "PROTOC=$protocPath" >> $env:GITHUB_ENV
      - name: Preserve verified native resources before later checks
        if: github.event_name != 'pull_request' && steps.setup.outputs.native-cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.setup.outputs.native-cache-key }}
          path: |
            .local-archive/dependencies/pdfium-7881
            .local-archive/dependencies/downloads
            .local-archive/dependencies/tesseract-source-5.5.4
            .local-archive/dependencies/tesseract
            .local-archive/dependencies/tesseract-5.5.4
            .local-archive/dependencies/license-sources
            .local-archive/native-ocr/binary-cache
            .local-archive/native-ocr/downloads
            .local-archive/tooling/protoc-36.2
      - name: Real bilingual OCR and scanned PDF with Unicode paths
        run: |
          python scripts/verify-ocr-runtime.py --runtime .local-archive/dependencies/tesseract-5.5.4 --worker target/debug/pkms-worker.exe --pdfium .local-archive/dependencies/pdfium-7881/bin/pdfium.dll --output .local-archive/test-runs/ci/ocr
          if ($LASTEXITCODE -ne 0) { throw 'Bundled OCR integration failed' }
      - name: Rust workspace tests
        run: cargo test --workspace --locked
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generate contracts and reject drift
        run: |
          pnpm contracts:generate
          if ($LASTEXITCODE -ne 0) { throw 'Contract generation failed' }
          $contractChanges = git status --porcelain --untracked-files=all -- packages/contracts/src/generated
          if ($LASTEXITCODE -ne 0) { throw 'Contract status check failed' }
          if ($contractChanges) { throw 'Regenerate and commit the Rust-defined TypeScript contracts.' }
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Serial frontend behavior tests
        run: pnpm --filter @pkms/desktop exec node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
      - name: Frontend production build
        run: pnpm --filter @pkms/desktop build
      - name: Build unsigned Windows installer
        if: github.event_name != 'pull_request'
        run: pnpm desktop:build
      - name: Collect installer, checksums and inventory
        if: github.event_name != 'pull_request'
        run: ./scripts/package-release.ps1
      - name: Retain build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spanseek-windows-x64-${{ github.sha }}
          path: .local-archive/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the immutable version tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Find a successful main build for this exact commit
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-version.mjs --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release version mismatch' }
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve tag commit' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $build = $null
          $page = 1
          do {
            $batch = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/actions/workflows/windows-checks.yml/runs?branch=main&status=success&per_page=100&page=$page" -Headers $headers
            $build = $batch.workflow_runs | Where-Object {
              $_.head_sha -ceq $sha -and $_.head_branch -ceq 'main' -and
              $_.head_repository.full_name -ceq $env:GH_REPO -and
              $_.event -in @('push', 'workflow_dispatch') -and $_.conclusion -eq 'success'
            } | Select-Object -First 1
            if ($build) { break }
            $page++
          } while ($batch.workflow_runs.Count -eq 100)
          if (-not $build) { throw 'This tag has no successful main build at the exact same commit. Complete or rerun that main build first.' }
          $artifacts = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/actions/runs/$($build.id)/artifacts?per_page=100" -Headers $headers
          $matching = @($artifacts.artifacts | Where-Object { $_.name -ceq "spanseek-windows-x64-$sha" -and -not $_.expired })
          if ($matching.Count -ne 1) { throw 'The checked build must have one retained release artifact' }
          "run-id=$($build.id)" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Output "Using successful main build $($build.id) for $sha"
      - name: Download the checked build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spanseek-windows-x64-${{ steps.checked.outputs.sha }}
          path: release
          run-id: ${{ steps.checked.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify every release file against the tagged source
        env:
          EXPECTED_SHA: ${{ steps.checked.outputs.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/verify-release-artifacts.ps1 -Directory release -ExpectedCommit $env:EXPECTED_SHA -ExpectedVersion ($env:RELEASE_TAG.Substring(1))
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $info = Get-Content -LiteralPath release/BUILD-INFO.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($info.version)") { throw 'Tag and downloaded artifact version differ' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $existing = $null
          try { $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" -Headers $headers }
          catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            # The tag endpoint does not expose unpublished drafts. Authenticated
            # release listings include them, so a rerun must search that list.
            $page = 1
            do {
              $batch = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=100&page=$page" -Headers $headers
              $matching = @($batch | Where-Object tag_name -CEQ $env:RELEASE_TAG)
              if ($matching.Count -gt 1) { throw 'Multiple releases match the requested tag' }
              if ($matching.Count -eq 1) { $existing = $matching[0]; break }
              $page++
            } while ($batch.Count -eq 100)
          }
          $files = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          if ($existing) {
            if (-not $existing.draft) { throw 'An already published release will not be overwritten' }
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            gh release create $env:RELEASE_TAG @files --verify-tag --draft --title "跨索 spanseek $($info.version)" --notes-file release/RELEASE-NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release draft upload failed' }
