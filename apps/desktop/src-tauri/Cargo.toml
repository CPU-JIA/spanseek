[package]
name = "pkms-desktop"
default-run = "spanseek"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "spanseek"
path = "src/main.rs"

[lib]
name = "pkms_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
pkms-core = { path = "../../../crates/pkms-core" }
pkms-app = { path = "../../../crates/pkms-app" }
tauri = { version = "2.12.1", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "=2.5.2"
webview2-com = "0.39.1"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
image.workspace = true
same-file = "=1.0.6"
tempfile.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
